spring.datasource.url=jdbc:h2:mem:giro;MODE=LEGACY;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

spring.flyway.enabled=false

giro.jwt.secret=test-secret-test-secret-test-secret-32b
giro.jwt.access-minutes=60
giro.uploads=${java.io.tmpdir}/giro-test-uploads
giro.cors-origins=http://localhost:5173
