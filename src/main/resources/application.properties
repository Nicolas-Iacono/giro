spring.application.name=giro

# Local. En Railway las pisa DATABASE_URL o PGHOST/PGPORT/PGDATABASE/PGUSER/PGPASSWORD.
spring.datasource.url=jdbc:postgresql://localhost:5432/giro
spring.datasource.username=giro
spring.datasource.password=giro

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true

spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB

# Railway inyecta PORT. En local, sin esa variable, sigue en 8081.
server.port=${PORT:8081}

giro.jwt.secret=${GIRO_JWT_SECRET:clave-local-de-giro-cambiar-antes-de-publicar-32}
giro.jwt.access-minutes=720
giro.uploads=${GIRO_UPLOADS:./data/uploads}
giro.cors-origins=${GIRO_CORS:http://localhost:5173,http://localhost:5174}

# Bucket Giro del proyecto kksdxwqcgrbemlpgjifr. La clave no va en git: variable GIRO_SUPABASE_KEY o backend/config/supabase.properties.
spring.config.import=optional:file:./config/supabase.properties
giro.supabase.url=${GIRO_SUPABASE_URL:https://kksdxwqcgrbemlpgjifr.supabase.co}
giro.supabase.bucket=${GIRO_SUPABASE_BUCKET:Giro}
giro.supabase.key=${GIRO_SUPABASE_KEY:}
